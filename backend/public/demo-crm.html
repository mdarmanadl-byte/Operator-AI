<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Operator AI — Demo CRM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
      background: #f5f7fb;
      color: #1f2937;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #eef2ff;
    }

    button {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #activity {
      margin-top: 20px;
      padding: 12px;
      background: white;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h1>Demo CRM</h1>

  <p class="subtitle">
    A simulated contact management application for Operator AI.
  </p>

  <table>
    <thead>
      <tr>
        <th>Contact</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr data-testid="contact-row" data-contact-name="Alice Johnson">
        <td>Alice Johnson</td>
        <td>alice@example.com</td>

        <td data-testid="contact-status">
          New
        </td>

        <td>
          <button data-testid="qualify-contact">
            Mark Qualified
          </button>
        </td>
      </tr>

      <tr data-testid="contact-row" data-contact-name="Bob Smith">
        <td>Bob Smith</td>
        <td>bob@example.com</td>

        <td data-testid="contact-status">
          New
        </td>

        <td>
          <button data-testid="qualify-contact">
            Mark Qualified
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div id="activity" role="status" aria-live="polite">
    Ready for actions.
  </div>

  <script>
    document
      .querySelectorAll('[data-testid="qualify-contact"]')
      .forEach((button) => {
        button.addEventListener("click", () => {
          const row = button.closest("tr");
          const name = row.dataset.contactName;

          row.querySelector(
            '[data-testid="contact-status"]'
          ).textContent = "Qualified";

          button.disabled = true;

          document.querySelector("#activity").textContent =
            `${name} marked as Qualified.`;
        });
      });
  </script>
</body>
</html>
