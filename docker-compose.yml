services:
  postgres:
    image: postgres:16
    container_name: operator-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: operator_ai
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: